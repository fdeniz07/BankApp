# BankApp lab ELK — receive Serilog-style JSON and index into Elasticsearch.
# HTTP: Serilog.Sinks.Http may post { "events": [ ... ] } or a JSON array.
# TCP: one Compact JSON object per line (json_lines).

input {
  http {
    port => 8080
    codec => plain
    type => "serilog-http"
  }
  tcp {
    port => 50000
    codec => json_lines
    type => "serilog-tcp"
  }
}

filter {
  if [type] == "serilog-http" {
    mutate { rename => { "message" => "raw_body" } }
    if [raw_body] =~ /^\s*\{/ {
      json {
        source => "raw_body"
        skip_on_invalid_json => true
      }
    }
    if [events] {
      split { field => "events" }
      ruby {
        code => '
          ev = event.get("events")
          if ev.is_a?(Hash)
            ev.each { |k, v| event.set(k, v) }
            event.remove("events")
          end
        '
      }
    }
    mutate { remove_field => ["raw_body", "headers", "host", "@version"] }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "bankapp-logs-%{+YYYY.MM.dd}"
  }
}
