# Full local stack: Seq + Redis + RabbitMQ + SQL + Vault + OTel (collector/Tempo/Prometheus/Grafana) + WebApi + Client
# SQL reuses existing Docker volume sqlserver-2025-data (same DB as former SQLServer2025).
#
# Usage (from repo root):
#   copy infra/.env.example infra/.env   # then edit if needed
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build
#   docker compose -f infra/docker-compose.yml --env-file infra/.env down
#   docker compose -f infra/docker-compose.yml --env-file infra/.env down -v
#   Note: down -v does NOT remove external volume sqlserver-2025-data
#
# Vault (dev mode) is optional for the app runtime today — WebApi still reads .env.
# UI: http://localhost:8200  |  seed job writes KV secret/bankapp
# Observability: Grafana http://localhost:3001 (default admin/admin) — Seq remains for logs

services:
  seq:
    image: datalust/seq:2024.3
    container_name: bankapp-seq
    ports:
      - "5341:80"
    environment:
      ACCEPT_EULA: "Y"
    volumes:
      - seq-data:/data
    # Seq image has no curl/wget — TCP open on :80 is enough for "ready to accept".
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80'"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: bankapp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: bankapp-rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector:0.114.0
    container_name: bankapp-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    depends_on:
      - tempo
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    container_name: bankapp-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: bankapp-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=24h"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - otel-collector
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: bankapp-grafana
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_DEFAULT_THEME: light
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.17
    container_name: bankapp-vault
    ports:
      - "${VAULT_PORT:-8200}:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "${VAULT_DEV_ROOT_TOKEN_ID:-bankapp-vault-root-token}"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  vault-seed:
    image: hashicorp/vault:1.17
    container_name: bankapp-vault-seed
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "${VAULT_DEV_ROOT_TOKEN_ID:-bankapp-vault-root-token}"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      TOKEN_SECURITY_KEY: "${TOKEN_SECURITY_KEY}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:-guest}"
    volumes:
      - ./scripts/vault-seed.sh:/vault-seed.sh:ro
    entrypoint: ["/bin/sh", "/vault-seed.sh"]
    restart: "no"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: bankapp-sql
    ports:
      - "${SQL_PORT:-11433}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "developer"
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  webapi:
    build:
      context: ..
      dockerfile: src/WebApi/Dockerfile
    container_name: bankapp-webapi
    ports:
      - "${WEBAPI_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:8080"
      DISABLE_HTTPS_REDIRECTION: "true"
      Database__RunMigrations: "true"
      Database__RunSeed: "true"
      ConnectionStrings__BankingConnectionString: "Data Source=sqlserver,1433;Initial Catalog=BankAppDb;User ID=sa;Password=${MSSQL_SA_PASSWORD};Connect Timeout=30;Encrypt=False;Trust Server Certificate=True;Application Intent=ReadWrite;Multi Subnet Failover=False;Command Timeout=30"
      Redis__ConnectionString: "redis:6379"
      Seq__ServerUrl: "http://seq"
      RabbitMq__Enabled: "true"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__UserName: "guest"
      RabbitMq__Password: "guest"
      RabbitMq__EmailConfirmationQueue: "email-confirmation"
      App__PublicClientBaseUrl: "${PUBLIC_CLIENT_BASE_URL:-http://localhost:3000}"
      Cors__AllowedOrigins__0: "${PUBLIC_CLIENT_BASE_URL:-http://localhost:3000}"
      TokenOptions__Audience: "${TOKEN_AUDIENCE:-BankAppAudience}"
      TokenOptions__Issuer: "${TOKEN_ISSUER:-BankAppIssuer}"
      TokenOptions__AccessTokenExpiration: "${TOKEN_EXPIRATION_MINUTES:-60}"
      TokenOptions__RememberMeAccessTokenExpiration: "${TOKEN_REMEMBER_ME_MINUTES:-10080}"
      TokenOptions__SecurityKey: "${TOKEN_SECURITY_KEY}"
      CacheSettings__SlidingExpirationMinutes: "30"
      OpenTelemetry__Enabled: "true"
      OpenTelemetry__ServiceName: "bankapp-webapi"
      OpenTelemetry__OtlpEndpoint: "http://otel-collector:4317"
    volumes:
      - profile-uploads:/app/wwwroot/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      seq:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  client:
    build:
      context: ../client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8080}"
    container_name: bankapp-client
    ports:
      - "${CLIENT_PORT:-3000}:80"
    depends_on:
      webapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  seq-data:
    name: bankapp-seq-data
  redis-data:
    name: bankapp-redis-data
  rabbitmq-data:
    name: bankapp-rabbitmq-data
  profile-uploads:
    name: bankapp-profile-uploads
  tempo-data:
    name: bankapp-tempo-data
  prometheus-data:
    name: bankapp-prometheus-data
  grafana-data:
    name: bankapp-grafana-data
  sqlserver-data:
    name: sqlserver-2025-data
    external: true
