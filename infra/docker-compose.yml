# Full local stack: Seq + Redis + SQL Server + WebApi + Client
# SQL reuses existing Docker volume sqlserver-2025-data (same DB as former SQLServer2025).
#
# Usage (from repo root):
#   copy infra/.env.example infra/.env   # then edit if needed
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build
#   docker compose -f infra/docker-compose.yml --env-file infra/.env down
#   docker compose -f infra/docker-compose.yml --env-file infra/.env down -v
#   Note: down -v does NOT remove external volume sqlserver-2025-data

services:
  seq:
    image: datalust/seq:2024.3
    container_name: bankapp-seq
    ports:
      - "5341:80"
    environment:
      ACCEPT_EULA: "Y"
    volumes:
      - seq-data:/data
    # Seq image has no curl/wget — TCP open on :80 is enough for "ready to accept".
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80'"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: bankapp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: bankapp-rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: bankapp-sql
    ports:
      - "${SQL_PORT:-11433}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "developer"
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  webapi:
    build:
      context: ..
      dockerfile: src/WebApi/Dockerfile
    container_name: bankapp-webapi
    ports:
      - "${WEBAPI_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:8080"
      Database__RunMigrations: "true"
      Database__RunSeed: "true"
      ConnectionStrings__BankingConnectionString: "Data Source=sqlserver,1433;Initial Catalog=BankAppDb;User ID=sa;Password=${MSSQL_SA_PASSWORD};Connect Timeout=30;Encrypt=False;Trust Server Certificate=True;Application Intent=ReadWrite;Multi Subnet Failover=False;Command Timeout=30"
      Redis__ConnectionString: "redis:6379"
      Seq__ServerUrl: "http://seq"
      RabbitMq__Enabled: "true"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__UserName: "guest"
      RabbitMq__Password: "guest"
      RabbitMq__EmailConfirmationQueue: "email-confirmation"
      App__PublicClientBaseUrl: "${PUBLIC_CLIENT_BASE_URL:-http://localhost:3000}"
      TokenOptions__Audience: "${TOKEN_AUDIENCE:-BankAppAudience}"
      TokenOptions__Issuer: "${TOKEN_ISSUER:-BankAppIssuer}"
      TokenOptions__AccessTokenExpiration: "${TOKEN_EXPIRATION_MINUTES:-60}"
      TokenOptions__RememberMeAccessTokenExpiration: "${TOKEN_REMEMBER_ME_MINUTES:-10080}"
      TokenOptions__SecurityKey: "${TOKEN_SECURITY_KEY}"
      CacheSettings__SlidingExpirationMinutes: "30"
    volumes:
      - profile-uploads:/app/wwwroot/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      seq:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  client:
    build:
      context: ../client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8080}"
    container_name: bankapp-client
    ports:
      - "${CLIENT_PORT:-3000}:80"
    depends_on:
      webapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  seq-data:
    name: bankapp-seq-data
  redis-data:
    name: bankapp-redis-data
  rabbitmq-data:
    name: bankapp-rabbitmq-data
  profile-uploads:
    name: bankapp-profile-uploads
  sqlserver-data:
    name: sqlserver-2025-data
    external: true
