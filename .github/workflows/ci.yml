name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # No packages.lock.json — hash csproj/slnx for global NuGet package folder
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore BankApp.slnx

      - name: Build
        run: dotnet build BankApp.slnx --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test tests/Application.UnitTests/Application.UnitTests.csproj --configuration Release --no-build --verbosity normal

      # CustomWebApplicationFactory sets Vault:Enabled=false — no Vault in CI.
      - name: Integration tests
        run: dotnet test tests/WebApi.IntegrationTests/WebApi.IntegrationTests.csproj --configuration Release --no-build --verbosity normal

      # Lab-only scripts: syntax check without running Vault/Compose.
      - name: Vault lab scripts syntax
        run: |
          bash -n infra/scripts/vault-seed.sh
          bash -n infra/scripts/vault-rotate-jwt.sh

  frontend:
    name: Client build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
